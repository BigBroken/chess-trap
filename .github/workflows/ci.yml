name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate trap data (all moves legal & consistent)
        run: npm run traps:validate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
